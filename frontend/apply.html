<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길드 가입 신청 - Aetherix E-sports</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/apply.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>⚔️ Aetherix E-sports</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/">홈</a></li>
                <li><a href="/">소개</a></li>
            </ul>
        </div>
    </nav>

    <section class="apply-section">
        <div class="container">
            <h1>길드 가입 신청</h1>
            <p class="subtitle">Aetherix E-sports에 가입하기 위해 다음 정보를 입력해주세요.</p>

            <form id="applicationForm" class="application-form">
                <!-- 기본 정보 -->
                <fieldset>
                    <legend>📋 기본 정보</legend>
                    
                    <div class="form-group">
                        <label for="nickname">게임 닉네임 *</label>
                        <input type="text" id="nickname" name="nickname" 
                               placeholder="예: AEX_Player" required>
                        <small>정확한 게임 닉네임을 입력해주세요.</small>
                    </div>

                    <div class="form-group">
                        <label for="discordId">디스코드 ID *</label>
                        <input type="text" id="discordId" name="discord_id" 
                               placeholder="예: username#1234" required>
                        <small>길드 연락을 위해 정확한 디스코드 ID를 입력해주세요.</small>
                    </div>
                </fieldset>

                <!-- 게임 정보 -->
                <fieldset>
                    <legend>🏆 게임 정보</legend>

                    <div class="form-group">
                        <label for="tier">현재 최고 티어 *</label>
                        <select id="tier" name="tier" required>
                            <option value="">선택해주세요</option>
                            <option value="브론즈">브론즈</option>
                            <option value="실버">실버</option>
                            <option value="골드">골드</option>
                            <option value="플래티넘">플래티넘</option>
                            <option value="다이아몬드">다이아몬드</option>
                            <option value="마스터">마스터</option>
                            <option value="그랜드마스터">그랜드마스터</option>
                            <option value="신화">신화</option>
                            <option value="에픽">에픽</option>
                            <option value="레전더리">레전더리</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="championsScore">챔피언스리그 최고 점수 *</label>
                        <select id="championsScore" name="champions_score" required>
                            <option value="">선택해주세요</option>
                            <option value="1200점 이하">1200점 이하</option>
                            <option value="1200 ~ 1500점">1200 ~ 1500점</option>
                            <option value="1500 ~ 1800점">1500 ~ 1800점</option>
                            <option value="1800 ~ 2000점">1800 ~ 2000점</option>
                            <option value="2000 ~ 2200점">2000 ~ 2200점</option>
                            <option value="2200 ~ 2400점">2200 ~ 2400점</option>
                            <option value="2400점 이상">2400점 이상</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="position">주 포지션 *</label>
                        <select id="position" name="position" required>
                            <option value="">선택해주세요</option>
                            <option value="탑">탑</option>
                            <option value="정글">정글</option>
                            <option value="미드">미드</option>
                            <option value="원거리 딜러">원거리 딜러</option>
                            <option value="서포터">서포터</option>
                            <option value="올라운더">올라운더</option>
                        </select>
                    </div>
                </fieldset>

                <!-- 활동 정보 -->
                <fieldset>
                    <legend>⏰ 활동 정보</legend>

                    <div class="form-group">
                        <label for="playTime">플레이 가능 시간 *</label>
                        <textarea id="playTime" name="play_time" 
                                  placeholder="예:\n평일: 19:00 ~ 23:00\n주말: 자유" 
                                  required></textarea>
                        <small>평일/주말별로 플레이 가능한 시간을 입력해주세요.</small>
                    </div>

                    <div class="form-group">
                        <label for="introduction">자기소개 *</label>
                        <textarea id="introduction" name="introduction" 
                                  placeholder="주로 플레이하는 챔피언, 게임 스타일, 길드 활동에 대한 포부 등을 자유롭게 작성해주세요."
                                  required></textarea>
                        <small>최대 500자까지 입력 가능합니다.</small>
                    </div>
                </fieldset>

                <!-- 제출 버튼 -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-large">신청하기</button>
                    <a href="/" class="btn btn-secondary">돌아가기</a>
                </div>
            </form>

            <!-- 에러 메시지 -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Aetherix E-sports. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/apply.js"></script>
</body>
</html>
