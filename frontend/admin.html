<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영진 관리 - Aetherix E-sports</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>⚔️ Aetherix E-sports</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/">홈</a></li>
                <li><span class="admin-badge">관리자 모드</span></li>
            </ul>
        </div>
    </nav>

    <section class="admin-section">
        <div class="container">
            <h1>지원자 관리</h1>
            
            <!-- 필터 및 검색 -->
            <div class="admin-controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="닉네임이나 디스코드 ID로 검색...">
                </div>
                <div class="filter-box">
                    <select id="statusFilter">
                        <option value="">모든 상태</option>
                        <option value="대기 중">대기 중</option>
                        <option value="승인">승인</option>
                        <option value="거절">거절</option>
                    </select>
                </div>
            </div>

            <!-- 지원자 목록 -->
            <div class="applications-list">
                <table id="applicationsTable">
                    <thead>
                        <tr>
                            <th>번호</th>
                            <th>닉네임</th>
                            <th>디스코드</th>
                            <th>티어</th>
                            <th>포지션</th>
                            <th>신청일</th>
                            <th>상태</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsBody">
                        <tr class="empty-row">
                            <td colspan="8">지원자가 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- 상세 조회 모달 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>신청서 상세</h2>
            
            <div id="detailContent" class="detail-content">
                <!-- 상세 정보가 여기에 표시됨 -->
            </div>

            <div class="modal-actions">
                <button id="approveBtn" class="btn btn-success">승인</button>
                <button id="rejectBtn" class="btn btn-danger">거절</button>
                <button id="cancelBtn" class="btn btn-secondary">닫기</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Aetherix E-sports. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
