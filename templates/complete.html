<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신청 완료 - Aetherix E-sports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">⚔️ Aetherix E-sports</h1>
            </div>
        </header>

        <!-- 완료 섹션 -->
        <section class="complete-section">
            <div class="complete-card">
                <div class="success-icon">✓</div>
                <h2>신청이 정상적으로 접수되었습니다.</h2>
                <p class="complete-message">
                    운영진 검토 후 디스코드를 통해 결과를 안내드리겠습니다.
                </p>
                <p class="thank-you">감사합니다!</p>
                
                <div class="next-steps">
                    <h3>다음 단계</h3>
                    <ul>
                        <li>✓ 디스코드 DM을 확인해주세요.</li>
                        <li>✓ 운영진 검토는 1-3일이 소요됩니다.</li>
                        <li>✓ 승인 시 길드 초대 링크를 전달받습니다.</li>
                    </ul>
                </div>

                <div class="actions">
                    <a href="/" class="home-button">홈으로 돌아가기</a>
                </div>
            </div>
        </section>

        <!-- 푸터 -->
        <footer class="footer">
            <p>&copy; 2026 Aetherix E-sports. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
