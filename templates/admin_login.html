<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - Aetherix E-sports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">⚔️ Aetherix E-sports</h1>
            </div>
        </header>

        <!-- 로그인 폼 -->
        <section class="login-section">
            <div class="login-card">
                <h2>관리자 로그인</h2>
                <p class="login-subtitle">관리자 계정으로 로그인하세요.</p>

                <form id="loginForm" class="login-form">
                    <div class="form-field">
                        <label for="username">아이디</label>
                        <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
                    </div>

                    <div class="form-field">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                    </div>

                    <button type="submit" class="submit-button">로그인</button>
                </form>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <a href="/" class="back-link">홈으로 돌아가기</a>
            </div>
        </section>

        <!-- 푸터 -->
        <footer class="footer">
            <p>&copy; 2026 Aetherix E-sports. All rights reserved.</p>
        </footer>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/admin';
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = '로그인 중 오류가 발생했습니다.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
