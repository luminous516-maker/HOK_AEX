<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길드 신청 - Aetherix E-sports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">⚔️ Aetherix E-sports</h1>
                <nav class="nav">
                    <a href="/" class="nav-link">홈</a>
                    <a href="/apply" class="nav-link active">신청</a>
                    <a href="/admin/login" class="nav-link">관리자</a>
                </nav>
            </div>
        </header>

        <!-- 신청 폼 -->
        <section class="apply-form-section">
            <h2>길드 신청 양식</h2>
            <p class="form-subtitle">아래 정보를 입력하고 신청서를 제출해주세요.</p>

            <form id="applicationForm" class="application-form">
                <!-- 기본 정보 -->
                <div class="form-group">
                    <h3>기본 정보</h3>
                    
                    <div class="form-row">
                        <div class="form-field">
                            <label for="nickname">게임 닉네임 <span class="required">*</span></label>
                            <input type="text" id="nickname" name="nickname" placeholder="게임 닉네임을 입력하세요" required>
                        </div>
                        <div class="form-field">
                            <label for="discord_id">디스코드 ID <span class="required">*</span></label>
                            <input type="text" id="discord_id" name="discord_id" placeholder="예: UserName#1234" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label for="age">나이</label>
                            <input type="number" id="age" name="age" placeholder="선택사항">
                        </div>
                    </div>
                </div>

                <!-- 게임 정보 -->
                <div class="form-group">
                    <h3>게임 정보</h3>
                    
                    <div class="form-row">
                        <div class="form-field">
                            <label for="tier">현재 티어 <span class="required">*</span></label>
                            <select id="tier" name="tier" required>
                                <option value="">선택하세요</option>
                                <option value="브론즈">브론즈</option>
                                <option value="실버">실버</option>
                                <option value="골드">골드</option>
                                <option value="플래티넘">플래티넘</option>
                                <option value="다이아몬드">다이아몬드</option>
                                <option value="마스터">마스터</option>
                                <option value="그랜드마스터">그랜드마스터</option>
                                <option value="신화">신화</option>
                                <option value="에픽">에픽</option>
                                <option value="레전더리">레전더리</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="champions_score">챔피언스리그 점수 <span class="required">*</span></label>
                            <select id="champions_score" name="champions_score" required>
                                <option value="">선택하세요</option>
                                <option value="1200점 이하">1200점 이하</option>
                                <option value="1200 ~ 1500점">1200 ~ 1500점</option>
                                <option value="1500 ~ 1800점">1500 ~ 1800점</option>
                                <option value="1800 ~ 2000점">1800 ~ 2000점</option>
                                <option value="2000 ~ 2200점">2000 ~ 2200점</option>
                                <option value="2200 ~ 2400점">2200 ~ 2400점</option>
                                <option value="2400점 이상">2400점 이상</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label for="position">주 포지션 <span class="required">*</span></label>
                            <select id="position" name="position" required>
                                <option value="">선택하세요</option>
                                <option value="탑">탑</option>
                                <option value="정글">정글</option>
                                <option value="미드">미드</option>
                                <option value="원거리 딜러">원거리 딜러</option>
                                <option value="서포터">서포터</option>
                                <option value="올라운더">올라운더</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 활동 정보 -->
                <div class="form-group">
                    <h3>활동 정보</h3>
                    
                    <div class="form-field">
                        <label for="play_time">플레이 가능 시간 <span class="required">*</span></label>
                        <textarea id="play_time" name="play_time" placeholder="예: 평일 19:00 ~ 23:00, 주말 자유 참여 가능" required></textarea>
                    </div>
                </div>

                <!-- 자기소개 -->
                <div class="form-group">
                    <h3>��기소개</h3>
                    
                    <div class="form-field">
                        <label for="introduction">자기소개 <span class="required">*</span></label>
                        <textarea id="introduction" name="introduction" placeholder="자신을 소개해주세요. 플레이 스타일, 가능한 역할, 길드 내 활동 계획 등을 자유롭게 작성해주세요." required></textarea>
                    </div>
                </div>

                <!-- 제출 버튼 -->
                <div class="form-actions">
                    <button type="submit" class="submit-button">신청서 제출</button>
                    <a href="/" class="cancel-button">취소</a>
                </div>
            </form>
        </section>

        <!-- 푸터 -->
        <footer class="footer">
            <p>&copy; 2026 Aetherix E-sports. All rights reserved.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/form.js') }}"></script>
</body>
</html>
